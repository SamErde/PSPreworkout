name: 📖 Validate Zensical Docs

on:
  pull_request:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/Deploy Zensical.yml"
      - ".github/workflows/Validate Zensical.yml"
      - "mkdocs.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: ✅ Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🐍 Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: ➕ Install Zensical
        run: python -m pip install --require-hashes --requirement docs/requirements.txt

      - name: 🏗️ Build Zensical Docs
        run: zensical build
