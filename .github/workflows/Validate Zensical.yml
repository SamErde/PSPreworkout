name: 📖 Validate Zensical Docs

on:
  pull_request:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/Deploy Zensical.yml"
      - ".github/workflows/Validate Zensical.yml"
      - "mkdocs.yml"

permissions:
  contents: read

# One run per pull request; a newer push cancels the older in-progress validation.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: ✅ Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🐍 Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: ➕ Install Zensical
        run: python -m pip install --require-hashes --requirement docs/requirements.txt

      - name: 🏗️ Build Zensical Docs
        run: zensical build
