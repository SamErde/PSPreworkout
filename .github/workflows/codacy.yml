# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow checks out code, performs a Codacy security scan
# and integrates the results with the
# GitHub Advanced Security code scanning feature.  For more information on
# the Codacy security scan action usage and parameters, see
# https://github.com/codacy/codacy-analysis-cli-action.
# For more information on Codacy Analysis CLI in general, see
# https://github.com/codacy/codacy-analysis-cli.

name: Codacy Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "main" ]
  schedule:
    - cron: '15 4 * * 6'

permissions:
  contents: read

# Pull request runs are grouped per PR and cancelled by newer pushes. Other runs are grouped per
# commit so no pending push or scheduled scan is replaced and every one uploads its SARIF results.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codacy-security-scan:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    name: Codacy Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Checkout the repository to the GitHub Actions runner
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Execute Codacy Analysis CLI and generate a SARIF output with the security issues identified during the analysis
      - name: Run Codacy Analysis CLI
        uses: codacy/codacy-analysis-cli-action@562ee3e92b8e92df8b67e0a5ff8aa8e261919c08 # v4.4.7
        with:
          # Check https://github.com/codacy/codacy-analysis-cli#project-token to get your project token from your Codacy repository
          # You can also omit the token and run the tools that support default configurations
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          verbose: true
          # Infrastructure or analyzer failures must not produce a successful empty scan.
          fail-if-incomplete: true
          output: results.sarif
          format: sarif
          # Adjust severity of non-security issues
          gh-code-scanning-compat: true
          # Report findings through GitHub code scanning without failing on issue counts.
          # Analyzer failures still fail the job via fail-if-incomplete.
          max-allowed-issues: 2147483647

      # Codacy emits one run per tool/language; GitHub requires one run per tool/category.
      - name: Combine SARIF runs for each analyzer
        if: ${{ !cancelled() && hashFiles('results.sarif') != '' }}
        shell: python
        run: |
          import json
          from pathlib import Path

          path = Path("results.sarif")
          report = json.loads(path.read_text(encoding="utf-8"))
          combined = {}
          for run in report["runs"]:
              driver = run["tool"]["driver"]
              key = (driver["name"], driver["version"])
              if key not in combined:
                  combined[key] = {
                      "tool": {"driver": {**driver, "rules": []}},
                      "results": [],
                      "artifacts": [],
                      "invocations": [],
                  }
              target = combined[key]
              rules = {rule["id"]: rule for rule in target["tool"]["driver"]["rules"]}
              rules.update({rule["id"]: rule for rule in driver.get("rules", [])})
              target["tool"]["driver"]["rules"] = list(rules.values())
              artifacts = {artifact["location"]["uri"]: artifact for artifact in target["artifacts"]}
              artifacts.update({artifact["location"]["uri"]: artifact for artifact in run.get("artifacts", [])})
              target["artifacts"] = list(artifacts.values())
              for result in run.get("results", []):
                  # Codacy supplies ruleId and uri too; remove indices invalidated by combining arrays.
                  result.pop("ruleIndex", None)
                  for location in result.get("locations", []):
                      location["physicalLocation"]["artifactLocation"].pop("index", None)
                  target["results"].append(result)
              target["invocations"].extend(run.get("invocations", []))
          report["runs"] = list(combined.values())
          path.write_text(json.dumps(report), encoding="utf-8")
          print(f"Prepared {len(report['runs'])} analyzer runs with "
                f"{sum(len(run['results']) for run in report['runs'])} findings.")

      # Preserve available findings even when strict mode reports an incomplete scan.
      # The failed analysis step still fails the job.
      - name: Upload SARIF results file
        if: ${{ !cancelled() && hashFiles('results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
