name: 📖 Deploy Zensical Docs to GitHub Pages

on:
  # Run when changes are made to the docs content, docs dependencies, workflow, or config.
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/Deploy Zensical.yml"
      - "mkdocs.yml"

  # Allow manual triggering of the workflow.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write

    steps:
      - name: ✅ Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ⚙️ Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: 🐍 Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: ➕ Install Zensical
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt

      - name: 🏗️ Build Zensical Docs
        run: zensical build

      - name: 📦 Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: ✅ Ensure deployment run is current branch head
        id: current-head-check
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const branch = context.ref.replace("refs/heads/", "");
            const response = await github.rest.repos.getBranch({ owner, repo, branch });
            const latestSha = response.data.commit.sha;
            const isCurrentHead = latestSha === context.sha;

            core.setOutput("is_current_head", isCurrentHead ? "true" : "false");

            if (!isCurrentHead) {
              core.notice(`Skipping stale deploy. Run SHA ${context.sha} is behind branch head ${latestSha}.`);
            }

      - name: 🚀 Deploy GitHub Pages artifact
        id: deployment
        if: steps.current-head-check.outputs.is_current_head == 'true'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
