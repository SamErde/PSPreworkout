name: 📖 Deploy Zensical Docs to GitHub Pages

on:
  # Run when changes are made to the docs content, docs dependencies, workflow, or config.
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/Deploy Zensical.yml"
      - "mkdocs.yml"

  # Allow manual triggering of the workflow.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Queue builds without dropping a newer pending run; stale pushes skip the expensive work.
    concurrency:
      group: ${{ github.workflow }}-build-${{ github.ref }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      pages: write
    outputs:
      is_current_head: ${{ steps.current-head-check.outputs.is_current_head }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Check current branch head
        id: current-head-check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            if (context.eventName === "workflow_dispatch") {
              core.setOutput("is_current_head", "true");
              return;
            }

            const { owner, repo } = context.repo;
            const branch = context.ref.replace("refs/heads/", "");
            const response = await github.rest.repos.getBranch({ owner, repo, branch });
            const isCurrentHead = response.data.commit.sha === context.sha;
            core.setOutput("is_current_head", isCurrentHead ? "true" : "false");

            if (!isCurrentHead) {
              core.notice(`Skipping stale build. Run SHA ${context.sha} is behind branch head ${response.data.commit.sha}.`);
            }

      - name: ✅ Checkout Repository
        if: steps.current-head-check.outputs.is_current_head == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ⚙️ Configure GitHub Pages
        if: steps.current-head-check.outputs.is_current_head == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: 🐍 Setup Python
        if: steps.current-head-check.outputs.is_current_head == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: ➕ Install Zensical
        if: steps.current-head-check.outputs.is_current_head == 'true'
        run: python -m pip install --require-hashes --requirement docs/requirements.txt

      - name: 🏗️ Build Zensical Docs
        if: steps.current-head-check.outputs.is_current_head == 'true'
        run: zensical build

      - name: 📦 Upload GitHub Pages artifact
        if: steps.current-head-check.outputs.is_current_head == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && needs.build.outputs.is_current_head == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: ✅ Ensure deployment run is current branch head
        id: current-head-check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const branch = context.ref.replace("refs/heads/", "");
            const response = await github.rest.repos.getBranch({ owner, repo, branch });
            const latestSha = response.data.commit.sha;
            const isCurrentHead = latestSha === context.sha;

            core.setOutput("is_current_head", isCurrentHead ? "true" : "false");

            if (!isCurrentHead) {
              core.notice(`Skipping stale deploy. Run SHA ${context.sha} is behind branch head ${latestSha}.`);
            }

      - name: 🚀 Deploy GitHub Pages artifact
        id: deployment
        if: steps.current-head-check.outputs.is_current_head == 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
