# Formats markdown files in docs/ using Prettier. Manual trigger only (workflow_dispatch).
name: 🖼️ Format Markdown

on:
  workflow_dispatch:

permissions:
  contents: read

# This workflow pushes formatting commits, so runs are serialized and never cancelled mid-push.
# Checkout credentials stay persisted because the formatting action pushes with them.
concurrency:
  group: format-markdown
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Format Markdown files
        uses: creyD/prettier_action@8c18391fdc98ed0d884c6345f03975edac71b8f0 # v4.6
        with:
          prettier_options: "--write docs/**/*.md"
          commit_message: "docs: format markdown files"
          git_identity: author
