name: 🏷️ Publish from Changelog Tag

# When pushing a new commit that is tagged with a version (eg: v1.2.5), check CHANGELOG.md for a header that
# matches this tag and publish a new GitHub release with it, then publish the module to the PowerShell Gallery.
on:
  push:
    # `paths` filters aren't reliably applied to tag pushes, so this trigger is scoped to
    # version tags only; the job's `if` guard below double-checks the ref is a tag.
    tags:
      - 'v*.*.*'

  # Allows manual triggering of the workflow.
  workflow_dispatch:

# Only allow one job to run at a time
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release:
    name: 🚀 Release and Publish
    # Only run if the commit contains a tag
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:

      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: ✅ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 📝 Extract Changelog Section
        id: changelog
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { found=1; print; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "::error::No CHANGELOG.md section found matching version $version"
            exit 1
          fi

      - name: 🥾 Bootstrap
        shell: pwsh
        run: .\src\actions_bootstrap.ps1

      - name: 👷‍♂️ Build Module Archive
        # Produces the .\src\Archive\*.zip package that the release step attaches below.
        shell: pwsh
        run: Invoke-Build -File .\src\PSPreworkout.build.ps1

      - name: 📦 Create GitHub Release
        # Creates a new release using the changelog section matching the pushed tag (eg: v1.2.5)
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        with:
          body_path: RELEASE_NOTES.md
          files: src/Archive/*.zip
          fail_on_unmatched_files: true

      - name: 🚀 Publish PowerShell Module
        env:
          PS_GALLERY_KEY: ${{ secrets.POWERSHELLGALLERY_KEY }}
        shell: pwsh
        run: |
          Write-Verbose "Script root dir:`t $PSScriptRoot"
          Write-Verbose "Working directory:`t $($PWD.path)"
          Publish-Module -Path '.\src\PSPreworkout' -NuGetApiKey ${{ secrets.POWERSHELLGALLERY_KEY }}
