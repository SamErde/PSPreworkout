name: 👷 Build Module
on:
  pull_request:
    branches:
      - main
      - prerelease
    paths:
      - "src/PSPreworkout/**"
      - "src/Tests/**"
      - "src/PSPreworkout.build.ps1"
      - "src/PSPreworkout.Settings.ps1"
      - "src/PSScriptAnalyzerSettings.psd1"
      - ".github/workflows/Build Module.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: 🧪 Run Tests and Build
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    # strategy:
    #  fail-fast: false

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: ✅ Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🥾 Bootstrap
        shell: pwsh
        run: .\src\actions_bootstrap.ps1

      - name: 👷‍♂️ Test and Build
        shell: pwsh
        run: Invoke-Build -File .\src\PSPreworkout.build.ps1

      - name: 🧪 Upload Pester Results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pester-results
          path: .\src\Artifacts\testOutput
          if-no-files-found: warn

      - name: 📦 Upload Build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zip-archive
          path: .\src\Archive
          if-no-files-found: warn
