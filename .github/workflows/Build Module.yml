name: 👷 Build Module
on:
  pull_request:
    branches:
      - main
      - prerelease
    paths:
      - "src/PSPreworkout/**"
      - "src/Tests/**"
      - "src/PSPreworkout.build.ps1"
      - "src/PSPreworkout.Settings.ps1"
      - "src/PSScriptAnalyzerSettings.psd1"
      - "Scripts/Update-AllTheThings*"
      - ".github/workflows/Build Module.yml"

  workflow_dispatch:

permissions:
  contents: read

# One run per pull request (or ref for manual runs) across both jobs; a newer push cancels the
# older in-progress run. Defined at workflow level so the compatibility matrix legs don't
# cancel each other, which a shared job-level group would do.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 🧪 Run Tests and Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # strategy:
    #  fail-fast: false

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: ✅ Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🥾 Bootstrap
        shell: pwsh
        run: .\src\actions_bootstrap.ps1

      - name: 👷‍♂️ Test and Build
        shell: pwsh
        run: Invoke-Build -File .\src\PSPreworkout.build.ps1

      - name: 🧪 Upload Pester Results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pester-results
          path: .\src\Artifacts\testOutput
          if-no-files-found: warn

      - name: 📦 Upload Build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zip-archive
          path: .\src\Archive
          if-no-files-found: warn

  compatibility-test:
    name: 🧪 Update-AllTheThings (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows PowerShell 5.1
            os: windows-latest
            executable: powershell.exe
          - name: PowerShell 7 on Windows
            os: windows-latest
            executable: pwsh
          - name: PowerShell 7 on Linux
            os: ubuntu-latest
            executable: pwsh

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: ✅ Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🧪 Run focused compatibility tests
        run: ${{ matrix.executable }} -NoLogo -NoProfile -File ./src/Tests/Invoke-UpdateAllTheThingsCompatibility.ps1
